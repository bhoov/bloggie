# The demo site: on every push to main, make a blog from template/ with this engine, as `npx` does, build it, and
# deploy it to GitHub Pages. A change that breaks a new blog fails here. Requires Settings → Pages → Source:
# "GitHub Actions".
name: Deploy the demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Make the demo blog
        run: node scripts/create.js "$RUNNER_TEMP/demo" --copy-engine --no-install --title "Bloggie"
      - name: Build it
        working-directory: ${{ runner.temp }}/demo
        run: npm install --no-audit --no-fund && npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
